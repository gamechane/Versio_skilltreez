# Nginx configuration for Gamechane
# Place this file in /etc/nginx/sites-available/gamechane
# Then create symlink: sudo ln -s /etc/nginx/sites-available/gamechane /etc/nginx/sites-enabled/

# HTTP server - redirects to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name gamechane.cluego.nl;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gamechane.cluego.nl;

    # SSL certificates (will be configured by Certbot)
    # ssl_certificate /etc/letsencrypt/live/gamechane.cluego.nl/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/gamechane.cluego.nl/privkey.pem;
    
    # SSL configuration (will be added by Certbot)
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Logging
    access_log /var/log/nginx/gamechane_access.log;
    error_log /var/log/nginx/gamechane_error.log;

    # Maximum upload size (adjust if needed)
    client_max_body_size 50M;

    # Proxy settings
    location / {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        
        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # WebSocket support (if needed)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffering
        proxy_buffering off;
    }

    # Health check endpoint (if available)
    location /actuator/health {
        proxy_pass http://localhost:8080/actuator/health;
        access_log off;
    }
}

